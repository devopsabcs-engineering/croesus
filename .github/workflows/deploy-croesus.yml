name: deploy-croesus

# Builds and deploys the Croesus mock SaaS OBO demo (SPA + API), then runs a
# gated post-deploy evidence job that proves the two-leg, audience-bound OBO
# flow and surfaces the claim evidence + portal deep links to the run summary.
#
# Auth model:
#   * Deploy identity  -> OIDC federated credential (no stored deploy secret).
#   * API confidential client -> certificate in Key Vault (never in this file).
# All public identifiers are non-secret GitHub Actions variables (vars.*).
# Only the CI test identity uses secrets (secrets.*), and only in the evidence job.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

env:
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # deploy identity (FIC), NOT the API credential
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  SPA_APP_NAME: ${{ vars.SPA_APP_NAME }}
  API_APP_NAME: ${{ vars.API_APP_NAME }}

jobs:
  build-spa:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spa/package-lock.json
      - name: Build SPA (public config only; client IDs/tenant/scope are NOT secrets)
        working-directory: ./spa
        env:
          VITE_SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
          VITE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_API_SCOPE: ${{ vars.API_SCOPE }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: ./spa/dist

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish API
        run: dotnet publish api/Croesus.Api.csproj -c Release -o ./api-publish
      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./api-publish

  deploy:
    name: Deploy SPA + API
    needs: [build-spa, build-api]
    runs-on: ubuntu-latest
    environment: production # manual gate + environment-scoped variables
    steps:
      - name: Download SPA artifact
        uses: actions/download-artifact@v4
        with:
          name: spa
          path: ./spa-dist
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./api-publish
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy SPA
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.SPA_APP_NAME }}
          package: ./spa-dist
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: ./api-publish
      - name: Publish API surface (Swagger / OpenAPI) to run summary
        shell: bash
        run: |
          set -euo pipefail
          API="https://${API_APP_NAME}.azurewebsites.net"
          SPA="https://${SPA_APP_NAME}.azurewebsites.net"
          {
            echo "## API surface (Swagger / OpenAPI)"
            echo ""
            echo "| Resource | URL |"
            echo "| --- | --- |"
            echo "| Swagger UI | ${API}/swagger |"
            echo "| OpenAPI document | ${API}/swagger/v1/swagger.json |"
            echo "| SPA (front end) | ${SPA} |"
            echo ""
            echo "Operations: \`GET /api/me\` (OBO good path) and, when \`Demo:EnableReplay\` is true, the gated \`POST /api/replay\` token-replay anti-pattern. All require an API-audienced bearer token with the \`access_as_user\` scope."
            echo ""
            echo "Full reference: <https://github.com/${GITHUB_REPOSITORY}/wiki/API-Reference>"
          } >> "$GITHUB_STEP_SUMMARY"

  evidence:
    name: Post-deploy OBO evidence
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: production
    env:
      TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      SPA_CLIENT_ID: ${{ vars.SPA_CLIENT_ID }}
      API_SCOPE: ${{ vars.API_SCOPE }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_SP_CLIENT_ID: ${{ secrets.TEST_SP_CLIENT_ID }}
      TEST_SP_CLIENT_SECRET: ${{ secrets.TEST_SP_CLIENT_SECRET }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      EVIDENCE_FILE: obo-evidence.md
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: OBO evidence mode
        run: |
          if [[ "${{ vars.ENABLE_ROPC_EVIDENCE }}" == "true" ]]; then
            echo "Headless ROPC smoke + negative tests: **enabled**." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "> **Headless ROPC evidence is disabled** (\`vars.ENABLE_ROPC_EVIDENCE\` is not \`true\`)."
              echo "> This tenant enforces MFA via managed Conditional Access, which the ROPC password grant cannot satisfy (\`AADSTS50079\`)."
              echo "> Validate the OBO flow interactively through the deployed SPA instead; see \`docs/obo-demo-guide.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Smoke test (two-leg claim summary)
        if: vars.ENABLE_ROPC_EVIDENCE == 'true'
        run: |
          chmod +x scripts/*.sh
          bash scripts/smoke-test.sh
      - name: Negative control (gated; fails if a mismatched-audience token is accepted)
        if: vars.ENABLE_ROPC_EVIDENCE == 'true'
        run: bash scripts/negative-test.sh
      - name: Correlate sign-in legs via Log Analytics
        env:
          WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          query='AADNonInteractiveUserSignInLogs
          | where TimeGenerated > ago(1h)
          | where AppDisplayName == "Croesus API" or ResourceDisplayName == "Microsoft Graph"
          | project TimeGenerated, CorrelationId, AppDisplayName, ResourceDisplayName, UserPrincipalName, ResourceIdentity, Status
          | sort by TimeGenerated asc'
          {
            echo "### OBO two-leg correlation (non-interactive sign-in logs)"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          if az monitor log-analytics query \
              --workspace "$WORKSPACE_ID" \
              --analytics-query "$query" \
              --output table | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null; then
            printf '\n' | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          else
            echo "_Log Analytics query returned no rows yet (sign-in logs can lag a few minutes)._" \
              | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          fi
          echo "> Full query set (interactive, non-interactive correlation, optional Token Protection): \`scripts/evidence-kql.kusto\`." \
            | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
      - name: Portal deep links
        run: |
          sub='${{ vars.AZURE_SUBSCRIPTION_ID }}'
          rg='${{ vars.RESOURCE_GROUP }}'
          {
            echo "### Live evidence deep links"
            echo ""
            echo "- Application Insights (transaction search, OBO claim logs): https://portal.azure.com/#blade/HubsExtension/BrowseResource/resourceType/microsoft.insights%2Fcomponents"
            echo "- Entra sign-in logs (interactive SPA -> API): https://entra.microsoft.com/#view/Microsoft_AAD_IAM/SignInsBlade"
            echo "- Entra non-interactive sign-in logs (API -> Graph OBO leg): https://entra.microsoft.com/#view/Microsoft_AAD_IAM/NonInteractiveSignInsBlade"
            echo ""
            echo "_Subscription \`${sub}\`, resource group \`${rg}\`._"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
      - name: Upload claim summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obo-evidence
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: ignore

  replay-lab:
    name: Tier 2 replay lab (manual, gated)
    needs: [deploy]
    runs-on: ubuntu-latest
    # OFF by default and never runs unattended. Two independent gates, mirroring
    # the evidence job's `environment: production` + `vars.ENABLE_ROPC_EVIDENCE`:
    #   1. `if: vars.ENABLE_REPLAY_LAB == 'true'` (opt-in repo variable), and
    #   2. `environment: replay-lab` (a distinct, manually-approved environment).
    # This job NEVER runs teardown: teardown is operator-run
    # (scripts/teardown-ca-policy.sh + scripts/teardown-app-registrations.sh,
    # which also resets Demo__EnableReplay=false); see docs/obo-demo-guide.md.
    if: vars.ENABLE_REPLAY_LAB == 'true'
    environment: replay-lab # manual approval gate, distinct from production
    env:
      # Non-secret public identifiers (object ids) the CA-policy script requires.
      TEST_USER_OBJECT_ID: ${{ vars.TEST_USER_OBJECT_ID }}
      BREAK_GLASS_USER_OBJECT_ID: ${{ vars.BREAK_GLASS_USER_OBJECT_ID }}
      WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
      EVIDENCE_FILE: tier2-replay-evidence.md
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision report-only Token Protection CA policy
        run: |
          chmod +x scripts/*.sh
          bash scripts/provision-ca-policy.sh
      - name: Enable the server-side replay gate (live app setting)
        run: |
          # A code-only deploy does NOT apply Bicep appSettings, so set the gate
          # live. Operator teardown flips it back to false.
          az webapp config appsettings set \
            --name "${{ vars.API_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --settings Demo__EnableReplay=true >/dev/null
          echo "> Live gate \`Demo__EnableReplay=true\` set on \`${{ vars.API_APP_NAME }}\` (reset to \`false\` via operator teardown)." >> "$GITHUB_STEP_SUMMARY"
      - name: Tier 2 replay evidence (Token Protection 1008 + two-leg correlation)
        run: |
          set -euo pipefail
          unbound_query='AADNonInteractiveUserSignInLogs
          | where TimeGenerated > ago(7d)
          | where TokenProtectionStatusDetails != ""
          | extend parsed = parse_json(TokenProtectionStatusDetails)
          | extend bindingStatus     = tostring(parsed["signInSessionStatus"])
          | extend bindingStatusCode = tostring(parsed["signInSessionStatusCode"])
          | where bindingStatusCode == "1008"
          | project TimeGenerated, UserPrincipalName, AppDisplayName, ResourceDisplayName,
                    IPAddress, bindingStatus, bindingStatusCode, CorrelationId, Id
          | sort by TimeGenerated desc'
          correlation_query='let interactive =
              SigninLogs
              | where TimeGenerated > ago(1d)
              | where AppDisplayName == "Croesus GPD Central SPA (mock)"
              | project L1_Time=TimeGenerated, CorrelationId, UserPrincipalName,
                        L1_IP=IPAddress, L1_Resource=ResourceDisplayName;
          let secondLeg =
              AADNonInteractiveUserSignInLogs
              | where TimeGenerated > ago(1d)
              | extend tp = parse_json(TokenProtectionStatusDetails)
              | project L2_Time=TimeGenerated, CorrelationId, UserPrincipalName,
                        L2_IP=IPAddress, L2_Resource=ResourceDisplayName, L2_App=AppDisplayName,
                        L2_Bind=tostring(tp["signInSessionStatus"]),
                        L2_Code=tostring(tp["signInSessionStatusCode"]);
          interactive
          | join kind=inner secondLeg on CorrelationId, UserPrincipalName
          | project UserPrincipalName, CorrelationId, L1_Time, L1_IP, L1_Resource,
                    L2_Time, L2_IP, L2_App, L2_Resource, L2_Bind, L2_Code
          | sort by L1_Time desc'
          {
            echo "### Tier 2b Token Protection unbound / 1008 evidence"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          if az monitor log-analytics query \
              --workspace "$WORKSPACE_ID" \
              --analytics-query "$unbound_query" \
              --output table | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null; then
            printf '\n' | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          else
            echo "_No 1008 rows yet: Token Protection 1008 populates only for a native-app client reaching Exchange Online / SharePoint Online / Teams under the report-only policy, and sign-in logs can lag a few minutes._" \
              | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          fi
          {
            echo ""
            echo "### Tier 2a two-leg correlation (interactive SPA <-> non-interactive OBO leg)"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          if az monitor log-analytics query \
              --workspace "$WORKSPACE_ID" \
              --analytics-query "$correlation_query" \
              --output table | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null; then
            printf '\n' | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          else
            echo "_Correlation returned no rows yet (sign-in logs can lag; widen the window in scripts/evidence-kql.kusto if needed)._" \
              | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
          fi
          echo "> Primary Tier 2a evidence is the API App Insights \`ReplayAttempt\` custom event; full query set: \`scripts/evidence-kql.kusto\`." \
            | tee -a "$GITHUB_STEP_SUMMARY" "$EVIDENCE_FILE" >/dev/null
      - name: Upload Tier 2 replay evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-replay-evidence
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: ignore
